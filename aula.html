<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comum.css">
<title>Aulas · Robótica</title>
<style>
  .aula { max-width: 860px; margin: 0 auto; padding: 24px 20px 48px; display: flex; flex-direction: column; gap: 14px; }
  .aula .sobre { font-family: 'JetBrains Mono', monospace; color: var(--verde); letter-spacing: 2px; font-size: 12px; }
  .aula h1 { font-size: 26px; margin-top: 4px; }
  .aula .tema { color: var(--suave); font-size: 14px; margin: 6px 0 0; line-height: 1.5; }
  .proj { background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .proj h2 { font-size: 17px; }
  .proj .tag { font-size: 11px; font-weight: 600; color: #221a00; background: var(--amarelo); border-radius: 999px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .proj p { margin: 0; line-height: 1.5; font-size: 14px; color: var(--suave); }
  .proj img { width: 100%; border-radius: 8px; background: #f4f6f8; display: block; }
  .proj .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .proj .links a { background: #1d2740; border: 1px solid var(--borda); border-radius: 8px; padding: 5px 10px; text-decoration: none; color: var(--texto); font-weight: 600; font-size: 13px; }
  .proj .links a:hover { border-color: var(--azul); }
  .proj details summary { cursor: pointer; font-weight: 600; color: var(--azul); font-size: 14px; }
  .proj pre { background: #0a0f1a; border: 1px solid var(--borda); border-radius: 10px; padding: 12px; overflow: auto; max-height: 420px; font-size: 13px; line-height: 1.45; margin: 8px 0 0; }
  .blocos { display: flex; flex-direction: column; gap: 8px; }
  .grupo { font-family: 'Space Grotesk', Arial, sans-serif; font-size: 15px; color: var(--suave); margin: 8px 0 -4px; text-transform: uppercase; letter-spacing: 1px; }
</style>
</head>
<body>
<script src="comum.js"></script>
<div id="menu"></div>
<main class="aula" id="aula"></main>
<script>
const TK = id => 'https://www.tinkercad.com/things/' + id;
// Cada projeto: titulo, texto, pecas, esquema (svg), codigo (.ino) ou blocos (imagens), links extras
const AULAS = {
  1: { data: '16/10', titulo: 'LED e protoboard', tema: 'Saída digital: o Arduino liga e desliga LEDs com digitalWrite e espera com delay.', projetos: [
    { titulo: 'LED piscando', texto: 'O LED acende por 1 segundo e apaga por 1 segundo, para sempre.', pecas: ['LED', 'Resistor 300 Ω'], esquema: 'aulas/01_led_piscando', codigo: 'aula1/led_piscando', links: [['Tinkercad', TK('7gEm8Jbq8td')]] },
    { titulo: 'Semáforo', texto: 'Verde por 3 segundos, amarelo por 1 e vermelho por 3, repetindo.', pecas: ['3 LEDs', '3 resistores 300 Ω'], esquema: 'aulas/02_semaforo', codigo: 'aula1/semaforo', links: [['Tinkercad', TK('5s8k3tmGoYp')]] },
    { titulo: 'Semáforo de pedestre', tag: 'desafio', texto: 'O semáforo dos carros fica verde até alguém apertar o botão; aí ele fecha e o do pedestre abre. LEDs dos carros nos pinos 12, 11 e 10, do pedestre no 7 (vermelho) e 6 (verde), botão no 2.', pecas: ['5 LEDs', '5 resistores 300 Ω', 'Botão'], codigo: 'aula1/semaforo_pedestre', links: [['Tinkercad', TK('1Vlmrn4FxMz')]] },
  ] },
  2: { data: '19/10', titulo: 'Botões e som', tema: 'Entrada digital: o Arduino lê o botão com digitalRead e toca notas no buzzer com tone.', projetos: [
    { titulo: 'Campainha', texto: 'Enquanto o botão está apertado, o buzzer toca. O botão usa INPUT_PULLUP: não precisa de resistor.', pecas: ['Botão', 'Buzzer'], esquema: 'aulas/04_campainha', codigo: 'aula2/campainha' },
    { titulo: 'Piano', texto: 'Quatro botões, quatro notas: dó, ré, mi e fá.', pecas: ['4 botões', 'Buzzer'], esquema: 'aulas/09_piano', codigo: 'aula2/piano' },
    { titulo: 'Brilha, brilha, estrelinha', texto: 'A música inteira tocando no buzzer do pino 8. Usa a mesma montagem do piano (só o buzzer).', pecas: ['Buzzer'], codigo: 'aula2/brilha_brilha' },
    { titulo: 'Genius', tag: 'extra', texto: 'Jogo da memória: os LEDs acendem numa sequência e é preciso repetir nos botões.', pecas: ['4 botões', '4 LEDs', '4 resistores 300 Ω', 'Buzzer'], esquema: 'aulas/10_genius', codigo: 'aula2/genius' },
    { titulo: 'Sensor de temperatura DHT11', tag: 'extra', texto: 'Lê a temperatura e a umidade e mostra no Monitor Serial. Precisa da biblioteca "DHT sensor library".', pecas: ['DHT11', 'Resistor 10 kΩ'], esquema: 'aulas/11_dht11', codigo: 'aula2/dht11' },
  ] },
  3: { data: '21/10', titulo: 'Luz, cor e sensores', tema: 'Entrada analógica (0 a 1023) e o alarme do Missão Impossível, montado uma peça de cada vez sem desmontar nada.', projetos: [
    { grupo: 'O alarme, arquivo por arquivo' },
    { titulo: 'Etapa 0: preparar a protoboard', texto: '5V no + de baixo, GND no − de baixo e fios ligando os trilhos de baixo aos de cima. Vale para todas as montagens daqui em diante.', esquema: 'aulas/11b_aula3_etapa0' },
    { titulo: 'Arquivo 01: potenciômetro', texto: 'O Monitor Serial mostra o valor do potenciômetro, de 0 a 1023.', pecas: ['Potenciômetro'], esquema: 'aulas/12_aula3_etapa1', codigo: 'aula3/01_potenciometro' },
    { titulo: 'Arquivo 02: brilho do LED', texto: 'O potenciômetro controla o brilho do LED.', pecas: ['LED', 'Resistor 300 Ω'], esquema: 'aulas/13_aula3_etapa2', codigo: 'aula3/02_led_brilho' },
    { titulo: 'Arquivo 03: LDR', texto: 'O LDR mede a luz; se escurecer, o LED acende.', pecas: ['LDR', 'Resistor 10 kΩ'], esquema: 'aulas/14_aula3_etapa3', codigo: 'aula3/03_ldr', links: [['Tinkercad', TK('21bJt5S1oA1')]] },
    { titulo: 'Arquivos 04 e 05: alarme com laser', texto: 'O laser aponta para o LDR. Se alguém cortar o feixe, o buzzer dispara. O botão liga e desliga o alarme.', pecas: ['Mini laser', 'Buzzer', 'Botão'], esquema: 'aulas/15_aula3_etapa5', codigo: 'aula3/05_botao_liga_desliga' },
    { titulo: 'Arquivo 06: LED RGB', texto: 'O LED RGB mostra o estado do alarme: desligado, calmo ou disparado.', pecas: ['LED RGB', '3 resistores 300 Ω'], esquema: 'aulas/16_aula3_etapa6', codigo: 'aula3/06_led_rgb' },
    { titulo: 'Arquivo 07: temperatura', texto: 'O DHT11 entra no alarme: se a sala esquentar acima do limite, ele dispara.', pecas: ['DHT11', 'Resistor 10 kΩ'], esquema: 'aulas/17_aula3_etapa7', codigo: 'aula3/07_temperatura' },
    { titulo: 'Arquivo 08: presença', tag: 'extra', texto: 'O sensor ultrassônico entra no alarme: se alguém chegar perto, ele dispara.', pecas: ['Sensor ultrassônico'], esquema: 'aulas/18_aula3_etapa8', codigo: 'aula3/08_ultrassonico' },
    { grupo: 'Desafios (usam a montagem do alarme)' },
    { titulo: 'Sirene', texto: 'O alarme alterna entre dois tons, como uma sirene.', codigo: 'aula3/09_desafio_sirene' },
    { titulo: 'Cores', texto: 'Com o alarme calmo, o LED RGB mostra uma cor misturada.', codigo: 'aula3/10_desafio_cores' },
    { titulo: 'Música do Missão Impossível', texto: 'A música tocando no buzzer, nota por nota.', codigo: 'aula3/11_desafio_musica' },
    { titulo: 'Termômetro colorido', texto: 'O LED RGB mostra a temperatura: azul frio, verde ok, vermelho quente.', codigo: 'aula3/13_desafio_termometro' },
    { titulo: 'Instrumento de um botão', texto: 'Segurando o botão, o buzzer toca; o potenciômetro escolhe a nota.', codigo: 'aula3/14_desafio_theremin' },
    { titulo: 'Luz noturna', texto: 'Quanto mais escuro no LDR, mais forte o LED.', codigo: 'aula3/15_desafio_luz_noturna' },
    { titulo: 'Cor no potenciômetro', texto: 'Girando o potenciômetro, o LED RGB vai do azul ao vermelho.', codigo: 'aula3/16_desafio_cor_girando' },
    { titulo: 'Botão de cores', texto: 'Cada aperto do botão troca a cor do LED RGB.', codigo: 'aula3/17_desafio_botao_cores' },
  ] },
  4: { data: '28/10', titulo: 'Distância e movimento', tema: 'Sensor ultrassônico (distância pelo eco) e servo motor (ir até um ângulo), com programação em blocos no Tinkercad.', projetos: [
    { titulo: 'Radar', texto: 'O servo gira o sensor de 15 a 165 graus e a tela desenha os objetos. O buzzer apita quando o feixe passa por um objeto.', pecas: ['Servo', 'Sensor ultrassônico', 'Buzzer'], esquema: 'aulas/43_aula4_etapa3', blocos: ['aula4/radar'], links: [['Tinkercad para montar', TK('cL28PivlSvx')], ['Tela do radar', 'radar.html']] },
    { titulo: 'Sensor de ré', texto: 'Três LEDs mostram se o objeto está longe (verde), perto (amarelo) ou muito perto (vermelho), com bip.', pecas: ['Sensor ultrassônico', '3 LEDs', '3 resistores 300 Ω', 'Buzzer'], esquema: 'aulas/44_aula4_sensor_re', blocos: ['aula4/sensor_re'], links: [['Tinkercad para montar', TK('9xckcBXKCl0')], ['Tela do sensor de ré', 'sensor-re.html']] },
    { titulo: 'Garra com joystick', texto: 'O joystick abre e fecha a garra montada no servo. Monte a garra com o servo parado em 60 graus (fechada); aberta é 150.', pecas: ['Servo com a garra', 'Joystick'], esquema: 'aulas/45_aula4_garra', blocos: ['aula4/garra'], links: [['Tinkercad para montar', TK('1joqnIWhsd8')]] },
  ] },
  5: { data: '30/10', titulo: 'Display e jogos', tema: 'Display de 7 segmentos mostrando os números de 0 a 9, e os jogos com tela no computador.', projetos: [
    { titulo: 'Display 0 a 9', texto: 'Sete LEDs em forma de 8: acendendo uns e apagando outros, aparece um número. O programa conta de 0 a 9.', pecas: ['Display de 7 segmentos', 'Resistor 300 Ω'], esquema: 'display', links: [['Abrir a página do display', 'display.html']] },
    { titulo: 'Os 6 jogos', texto: 'Nave, quiz, ritmo, cabo de guerra, desarme a bomba e pescaria com a garra, cada um com montagem e tela.', links: [['Ver os jogos', './']] },
  ] },
};

function mostrar() {
  const n = Number(location.hash.slice(1)) || 1;
  const a = AULAS[n] || AULAS[1];
  document.getElementById('menu').innerHTML = menuHtml('Aula ' + n);
  document.title = `Aula ${n} · Robótica`;
  const el = document.getElementById('aula');
  el.innerHTML = `<header><div class="sobre">AULA ${n} · ${a.data}</div><h1>${a.titulo}</h1><p class="tema">${a.tema}</p></header>` +
    a.projetos.map((p, i) => p.grupo ? `<h2 class="grupo">${p.grupo}</h2>` : `
    <section class="proj">
      <h2>${p.titulo}${p.tag ? `<span class="tag">${p.tag}</span>` : ''}</h2>
      <p>${p.texto}</p>
      ${p.pecas ? `<ul class="pecas">${p.pecas.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
      ${p.esquema ? `<a href="esquemas/${p.esquema}.svg" target="_blank"><img src="esquemas/${p.esquema}.svg" alt="Montagem: ${p.titulo}" loading="lazy"></a>` : ''}
      ${p.blocos ? `<div class="blocos">${p.blocos.map(b => `<img src="blocos/${b}.png" alt="Blocos: ${p.titulo}" loading="lazy">`).join('')}</div>` : ''}
      ${p.codigo ? `<details><summary>Ver o código</summary><pre data-src="codigo/${p.codigo}.ino">carregando...</pre></details>` : ''}
      ${p.links ? `<div class="links">${p.links.map(([t, h]) => `<a href="${h}"${h.startsWith('http') ? ' target="_blank"' : ''}>${t}</a>`).join('')}</div>` : ''}
    </section>`).join('');
  // o código só é baixado quando a pessoa abre o "Ver o código"
  el.querySelectorAll('details').forEach(d => d.addEventListener('toggle', () => {
    const pre = d.querySelector('pre');
    if (d.open && pre.textContent === 'carregando...') fetch(pre.dataset.src, { cache: 'no-cache' }).then(r => r.text()).then(t => pre.textContent = t);
  }));
  scrollTo(0, 0);
}
addEventListener('hashchange', mostrar);
mostrar();
</script>
</body>
</html>
