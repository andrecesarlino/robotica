<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comum.css">
<title>Robótica</title>
</head>
<body>
<script src="comum.js"></script>
<script>
montarPagina({
  id: 'display',
  imagem: 'esquemas/display.svg',
  semBlocos: 'O programa do display o professor mostra na aula.',
  titulo: 'Display 0 a 9',
  descricao: 'O display de 7 segmentos tem 7 LEDs compridos (os segmentos a até g). O CI 4511 recebe um número em binário por 4 fios e acende os segmentos certos. O programa conta de 0 a 9, um número por segundo, e a tela mostra o mesmo número.',
  pecas: ['Display de 7 segmentos', 'CI 4511', '1 resistor 300 Ω'],
  ligacoes: [
    ['4511 entrada A (pino 7 do chip)', '2', ''],
    ['4511 entrada B (pino 1 do chip)', '3', ''],
    ['4511 entrada C (pino 2 do chip)', '4', ''],
    ['4511 entrada D (pino 6 do chip)', '5', ''],
    ['4511 pinos 16, 3 e 4 (5V, LT, BL)', '5V', ''],
    ['4511 pinos 8 e 5 (GND, LE)', 'GND', ''],
    ['4511 saídas a até g (pinos 13, 12, 11, 10, 9, 15, 14)', 'display', 'cada saída no segmento de mesma letra'],
    ['Display, pino do meio (comum)', 'GND', 'com resistor de 300 Ω'],
  ],
  passosExtras: ['O chanfro (a meia-lua) do 4511 fica à esquerda: o pino 1 é o de baixo à esquerda.'],
  teclado: 'Sem Arduino: teclas 0 a 9',
  teclas: Object.fromEntries([...'0123456789'].map(n => [n, n])),
});

const NUMEROS = ['abcdef', 'bc', 'abdeg', 'abcdg', 'bcfg', 'acdfg', 'acdefg', 'abc', 'abcdefg', 'abcdfg'];
let numero = 0;
Arduino.aoReceber = linha => { const n = Number(linha); if (Number.isInteger(n) && n >= 0 && n <= 9) numero = n; };

function quadro() {
  requestAnimationFrame(quadro);
  const { ctx, W, H, s } = prepararTela();
  ctx.fillStyle = '#0d1321'; ctx.fillRect(0, 0, W, H);
  const h = Math.min(H * 0.8, W * 0.9), w = h * 0.55, x = W / 2 - w / 2, y = H / 2 - h / 2;
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.roundRect(x - h * 0.08, y - h * 0.05, w + h * 0.16, h * 1.1, 20 * s); ctx.fill();
  const g = h * 0.09, m = g * 0.6;  // espessura e margem dos segmentos
  const seg = {
    a: [x + m, y, w - 2 * m, g], d: [x + m, y + h - g, w - 2 * m, g], g: [x + m, y + h / 2 - g / 2, w - 2 * m, g],
    f: [x, y + m, g, h / 2 - 2 * m + g / 2], b: [x + w - g, y + m, g, h / 2 - 2 * m + g / 2],
    e: [x, y + h / 2 + m - g / 2, g, h / 2 - 2 * m + g / 2], c: [x + w - g, y + h / 2 + m - g / 2, g, h / 2 - 2 * m + g / 2],
  };
  for (const [nome, [sx, sy, sw, sh]] of Object.entries(seg)) {
    const aceso = NUMEROS[numero].includes(nome);
    ctx.fillStyle = aceso ? '#ff3b3b' : '#2a1416';
    ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = aceso ? 30 * s : 0;
    ctx.beginPath(); ctx.roundRect(sx, sy, sw, sh, g / 2); ctx.fill();
    ctx.shadowBlur = 0;
    texto(ctx, nome, sx + sw / 2, sy + sh / 2, g * 0.6, aceso ? '#fff' : '#5a2a2e');
  }
}
requestAnimationFrame(quadro);
</script>
</body>
</html>
