<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comum.css">
<title>Robótica</title>
</head>
<body>
<script src="comum.js"></script>
<script>
montarPagina({
  id: 'nave',
  tinkercad: 'https://www.tinkercad.com/things/hnOAiQ3i9ow',
  imagem: 'esquemas/nave.svg',  // o print do Tinkercad ainda não tem o botão da bomba
  titulo: 'Nave controlada pela mão',
  descricao: 'Passe a mão sobre o sensor ultrassônico: mão perto, a nave desce; mão longe, a nave sobe. Desvie dos asteroides e aperte o botão para atirar. Os tiros acabam: pegue as caixas verdes (+10). O segundo botão solta uma bomba que destrói tudo na tela (começa com 1; a caixa roxa dá mais uma). Depois de 20 segundos aparecem naves inimigas que atiram e precisam de 2 tiros. A música toca no buzzer; bateu, toca o som da batida e o LED pisca branco. São 3 vidas e a cor do LED mostra quantas restam: verde, amarelo, vermelho.',
  pecas: ['Sensor ultrassônico', '2 botões', 'Buzzer', 'LED RGB', '3 resistores 300 Ω'],
  ligacoes: [
    ['Ultrassônico Trig', '10', 'VCC no 5V, GND no GND'],
    ['Ultrassônico Echo', '11', ''],
    ['Botão (atirar)', '2', 'o lado oposto do botão vai no GND'],
    ['Botão (bomba)', '3', 'o lado oposto do botão vai no GND'],
    ['Buzzer +', '8', 'a outra perna vai no GND'],
    ['LED RGB vermelho (R)', '7', 'com resistor de 300 Ω'],
    ['LED RGB verde (G)', '6', 'com resistor de 300 Ω'],
    ['LED RGB azul (B)', '5', 'com resistor de 300 Ω. A perna maior do LED vai no GND'],
  ],
  passosExtras: ['Deixe o sensor deitado na mesa, olhando para cima. A mão funciona entre 5 e 25 cm de altura.'],
  teclado: 'Sem Arduino: mouse sobe e desce a nave, espaço atira, B solta a bomba',
  teclas: { ' ': 'B1', b: 'B2' },
});

const PERTO = 5, LONGE = 25;      // cm: faixa da mão (fundo e topo da tela)
let alvoY = 0.5, naveY = 0.5;     // 0 = em cima, 1 = embaixo
let estado = 'parado';            // parado, jogando, fim
let fimEm = -1e9;
let pontos = 0, vidas = 3, tempo = 0, piscar = 0;
let asteroides = [], tiros = [], estrelas = [], explosoes = [];
for (let i = 0; i < 120; i++) estrelas.push({ x: Math.random(), y: Math.random(), v: 0.02 + Math.random() * 0.08 });

let leituras = [], maoCm = null, foraSeguidas = 0;  // últimas medidas boas, onde a mão está, leituras erradas seguidas
Arduino.aoReceber = linha => {
  if (linha[0] === 'D') {
    const d = Number(linha.slice(1));
    // O sensor mede ~30 vezes por segundo e a mão anda poucos cm entre uma medida e outra. Medida que salta mais
    // de 10 cm é o sensor errando (vê o teto, perde o eco): ignora. Se o salto durar 15 medidas (~0,5 s), a mão
    // foi mesmo para outro lugar e o jogo aceita. Testado com uma gravação real do sensor: nenhum pulo na nave.
    if (d >= 2) {
      if (maoCm !== null && Math.abs(d - maoCm) > 10 && ++foraSeguidas < 15) return;
      if (foraSeguidas >= 15) leituras = [];
      foraSeguidas = 0;
      leituras.push(d);
      if (leituras.length > 3) leituras.shift();
      maoCm = [...leituras].sort((a, b) => a - b)[leituras.length >> 1];
      alvoY = 1 - Math.min(1, Math.max(0, (maoCm - PERTO) / (LONGE - PERTO)));
    }
  }
  if (linha === 'B1') atirar();
  if (linha === 'B2') bomba();
};
document.addEventListener('mousemove', e => {
  if (Arduino.escritor) return;
  const r = document.getElementById('tela').getBoundingClientRect();
  if (e.clientY > r.top) alvoY = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
});

// Música em números de nota do bloco "reproduzir alto-falante" do Tinkercad (57 = lá, 440 Hz; o bloco aceita de 35 a 127).
// Com o Arduino conectado toca no buzzer; sem ele, no computador.
const MUSICA = [57, 0, 60, 0, 64, 62, 60, 0, 55, 0, 57, 60, 59, 0, 0, 0,
                57, 0, 60, 0, 64, 67, 64, 0, 62, 0, 60, 59, 57, 0, 0, 0];
const BATIDA = [45, 40, 36, 0];                              // depois da pausa a música continua de onde parou
const MORTE = [55, 0, 54, 0, 53, 0, 52, 52, 0, 48, 48, 48];  // descendo, e o jogo fica em silêncio
let efeito = [], passoMusica = 0;
function tocar(nota) {
  if (Arduino.escritor) Arduino.nota(nota);
  else som(440 * 2 ** ((nota - 57) / 12), 140, 0.03, 'square');
}
setInterval(() => {
  if (efeito.length) { const n = efeito.shift(); if (n) tocar(n); return; }
  if (estado !== 'jogando') { passoMusica = 0; return; }
  const n = MUSICA[passoMusica++ % MUSICA.length];
  if (n) tocar(n);
}, 160);

// LED RGB: a cor mostra as vidas (verde, amarelo, vermelho) e pisca azul no tiro e branco na batida.
let voltarCor;
function corDasVidas() { Arduino.enviar(vidas >= 3 ? 'g' : vidas === 2 ? 'y' : 'r'); }
function piscarCor(letra, ms) {
  Arduino.enviar(letra);
  clearTimeout(voltarCor);
  voltarCor = setTimeout(() => estado === 'jogando' && corDasVidas(), ms);
}

// Munição: começa com 10 tiros; a caixa verde que passa voando dá mais 10. Sem tiro, só dá para desviar.
// Inimigos: a partir de 20 s aparecem naves vermelhas em zigue-zague que atiram; precisam de 2 tiros.
const MUNICAO_INICIO = 10, MUNICAO_CAIXA = 10, MUNICAO_MAX = 30, INIMIGOS_DEPOIS_DE = 20;
let municao = 0, caixas = [], inimigos = [], balas = [];
// Bomba (segundo botão, pino 3): destrói tudo o que está na tela. Começa com 1; a caixa roxa, rara, dá mais uma.
const BOMBAS_INICIO = 1, BOMBAS_MAX = 3, EXPLOSAO = [43, 40, 38, 36, 35, 0];
let bombas = 0, clarao = 0, W_ULTIMO = 1;  // W_ULTIMO: largura da tela no último quadro, para a bomba posicionar as explosões

function comecar() {
  estado = 'jogando'; pontos = 0; vidas = 3; tempo = 0; municao = MUNICAO_INICIO; bombas = BOMBAS_INICIO;
  asteroides = []; tiros = []; explosoes = []; efeito = []; caixas = []; inimigos = []; balas = [];
  corDasVidas();
}
function atirar() {
  if (estado !== 'jogando') { if (performance.now() - fimEm > 1500) comecar(); return; }
  if (municao <= 0) { som(180, 90, 0.05, 'square'); return; }  // sem munição: só um clique grave
  if (tiros.length > 4) return;
  municao--;
  tiros.push({ x: 0.16, y: naveY });
  Arduino.enviar('t'); som(1800, 30);
  piscarCor('b', 120);
}
function bomba() {
  if (estado !== 'jogando') return;
  if (bombas <= 0) { som(180, 90, 0.05, 'square'); return; }
  bombas--; clarao = 1;
  for (const a of asteroides) { a.morto = true; pontos += 10; explosoes.push({ x: a.x * W_ULTIMO, y: a.y, t: 0, cor: '#ffd166' }); }
  for (const e of inimigos) { e.morto = true; pontos += 30; explosoes.push({ x: e.x * W_ULTIMO, y: e.y, t: 0, cor: '#ff5470' }); }
  balas = [];
  efeito = [...EXPLOSAO]; piscarCor('p', 500); som(90, 500, 0.08, 'sawtooth');
}
function bater(x, y) {
  vidas--; piscar = 1; explosoes.push({ x, y, t: 0, cor: '#ff5470' });
  piscarCor('w', 300); efeito = [...BATIDA];
  if (vidas <= 0) {
    estado = 'fim'; fimEm = performance.now(); recorde('nave', pontos);
    clearTimeout(voltarCor); Arduino.enviar('p'); efeito = [...MORTE];
  }
}
document.getElementById('tela').addEventListener('click', () => { if (estado !== 'jogando') comecar(); });

let antes = performance.now();
function quadro(agora) {
  requestAnimationFrame(quadro);
  const dt = Math.min(0.1, (agora - antes) / 1000); antes = agora;
  const { ctx, W, H, s } = prepararTela();
  W_ULTIMO = W;
  naveY += (alvoY - naveY) * Math.min(1, dt * 6);  // desliza até a posição da mão, sem pular

  ctx.fillStyle = '#050813'; ctx.fillRect(0, 0, W, H);
  for (const e of estrelas) {
    e.x -= e.v * dt * (estado === 'jogando' ? 3 : 1); if (e.x < 0) { e.x = 1; e.y = Math.random(); }
    ctx.fillStyle = `rgba(255,255,255,${e.v * 8})`; ctx.fillRect(e.x * W, e.y * H, 2 * s, 2 * s);
  }
  const margem = 40 * s, alturaUtil = H - 2 * margem;
  const ny = margem + naveY * alturaUtil, nx = W * 0.12;

  if (estado === 'jogando') {
    tempo += dt;
    const velocidade = 0.25 + tempo * 0.008;
    if (Math.random() < dt * (0.9 + tempo * 0.04)) {
      const r = (18 + Math.random() * 30) * s;
      asteroides.push({ x: 1.05, y: margem + Math.random() * alturaUtil, r, v: velocidade * (0.8 + Math.random() * 0.6), giro: Math.random() * 6, lados: 7 + (Math.random() * 4 | 0) });
    }
    for (const a of asteroides) { a.x -= a.v * dt; a.giro += dt; }
    for (const t of tiros) t.x += 1.2 * dt;
    // tiro acerta asteroide
    for (const t of tiros) for (const a of asteroides) {
      if (!a.morto && !t.morto && Math.hypot(t.x * W - a.x * W, margem + t.y * alturaUtil - a.y) < a.r + 6 * s) {
        a.morto = t.morto = true; pontos += 10; explosoes.push({ x: a.x * W, y: a.y, t: 0, cor: '#ffd166' });
        Arduino.enviar('a'); som(1200, 80);
      }
    }
    // asteroide bate na nave
    for (const a of asteroides) {
      if (!a.morto && estado === 'jogando' && Math.hypot(a.x * W - nx, a.y - ny) < a.r + 18 * s) { a.morto = true; bater(nx, ny); }
      if (a.x < -0.1 && !a.morto) { a.morto = true; pontos += 1; }
    }

    // caixa de munição: aparece mais quando os tiros estão acabando
    if (Math.random() < dt * (municao < 4 ? 0.25 : 0.08)) caixas.push({ x: 1.05, y: margem + Math.random() * alturaUtil, giro: 0 });
    for (const c of caixas) {
      c.x -= 0.22 * dt; c.giro += dt * 2;
      if (!c.pega && Math.hypot(c.x * W - nx, c.y - ny) < 34 * s) {
        c.pega = true;
        if (c.bomba) bombas = Math.min(BOMBAS_MAX, bombas + 1); else municao = Math.min(MUNICAO_MAX, municao + MUNICAO_CAIXA);
        Arduino.enviar('a'); som(900, 60); setTimeout(() => som(1400, 90), 70);
        explosoes.push({ x: c.x * W, y: c.y, t: 0, cor: c.bomba ? '#b04dff' : '#3ddc84' });
      }
    }
    if (Math.random() < dt * 0.03) caixas.push({ x: 1.05, y: margem + Math.random() * alturaUtil, giro: 0, bomba: true });
    caixas = caixas.filter(c => !c.pega && c.x > -0.1);

    // inimigos: entram pela direita em zigue-zague e atiram bolinhas na direção da nave
    if (tempo > INIMIGOS_DEPOIS_DE && inimigos.length < 3 && Math.random() < dt * (0.12 + (tempo - INIMIGOS_DEPOIS_DE) * 0.004)) {
      inimigos.push({ x: 1.05, base: margem + (0.15 + Math.random() * 0.7) * alturaUtil, fase: Math.random() * 6, vida: 2, recarga: 1 + Math.random(), y: 0 });
    }
    for (const e of inimigos) {
      e.x -= 0.1 * dt; e.fase += dt * 2;
      e.y = e.base + Math.sin(e.fase) * 0.12 * alturaUtil;
      e.recarga -= dt;
      if (e.recarga <= 0 && e.x < 0.95) {
        e.recarga = 2 + Math.random();
        const dx = nx - e.x * W, dy = ny - e.y, n = Math.hypot(dx, dy);
        balas.push({ x: e.x * W, y: e.y, vx: dx / n * 260 * s, vy: dy / n * 260 * s });
        som(500, 50, 0.03, 'square');
      }
      for (const t of tiros) if (!t.morto && Math.hypot(t.x * W - e.x * W, margem + t.y * alturaUtil - e.y) < 26 * s) {
        t.morto = true; e.vida--; e.atingido = 0.15;
        if (e.vida <= 0) { e.morto = true; pontos += 30; explosoes.push({ x: e.x * W, y: e.y, t: 0, cor: '#ff5470' }); Arduino.enviar('a'); som(700, 120); }
      }
      if (!e.morto && estado === 'jogando' && Math.hypot(e.x * W - nx, e.y - ny) < 40 * s) { e.morto = true; bater(nx, ny); }
      e.atingido = Math.max(0, (e.atingido || 0) - dt);
    }
    inimigos = inimigos.filter(e => !e.morto && e.x > -0.1);
    for (const b of balas) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (!b.morto && estado === 'jogando' && Math.hypot(b.x - nx, b.y - ny) < 22 * s) { b.morto = true; bater(nx, ny); }
    }
    balas = balas.filter(b => !b.morto && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);

    asteroides = asteroides.filter(a => !a.morto);
    tiros = tiros.filter(t => !t.morto && t.x < 1.1);
  }

  for (const a of asteroides) {
    ctx.save(); ctx.translate(a.x * W, a.y); ctx.rotate(a.giro);
    ctx.beginPath();
    for (let i = 0; i < a.lados; i++) {
      const ang = i / a.lados * Math.PI * 2, rr = a.r * (0.75 + 0.25 * Math.sin(i * 7.3 + a.lados));
      ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
    }
    ctx.closePath(); ctx.fillStyle = '#5a5f73'; ctx.fill(); ctx.strokeStyle = '#9aa0b8'; ctx.lineWidth = 2 * s; ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = '#4ea8ff';
  for (const t of tiros) ctx.fillRect(t.x * W, margem + t.y * alturaUtil - 2 * s, 26 * s, 4 * s);
  // caixas de munição: quadrado verde balançando com "+10"
  for (const c of caixas) {
    ctx.save(); ctx.translate(c.x * W, c.y); ctx.rotate(Math.sin(c.giro) * 0.3);
    ctx.fillStyle = c.bomba ? '#b04dff' : '#3ddc84'; ctx.fillRect(-20 * s, -16 * s, 40 * s, 32 * s);
    texto(ctx, c.bomba ? 'B' : `+${MUNICAO_CAIXA}`, 0, 1 * s, 18 * s, c.bomba ? '#fff' : '#0b3d22');
    ctx.restore();
  }
  // inimigos: nave vermelha virada para a esquerda (pisca branco quando leva tiro)
  for (const e of inimigos) {
    ctx.save(); ctx.translate(e.x * W, e.y);
    ctx.fillStyle = e.atingido > 0 ? '#ffffff' : '#ff5470';
    ctx.beginPath(); ctx.moveTo(-28 * s, 0); ctx.lineTo(20 * s, -18 * s); ctx.lineTo(12 * s, 0); ctx.lineTo(20 * s, 18 * s); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.ellipse(0, 0, 7 * s, 4 * s, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = '#ff8fa3';
  for (const b of balas) { ctx.beginPath(); ctx.arc(b.x, b.y, 6 * s, 0, 7); ctx.fill(); }

  // nave
  piscar = Math.max(0, piscar - dt);
  if (estado !== 'fim' && !(piscar > 0 && Math.floor(piscar * 12) % 2)) {
    ctx.save(); ctx.translate(nx, ny);
    ctx.fillStyle = '#ff9f1c'; ctx.beginPath(); ctx.moveTo(-26 * s, -6 * s); ctx.lineTo(-40 * s - Math.random() * 12 * s, 0); ctx.lineTo(-26 * s, 6 * s); ctx.fill();
    ctx.fillStyle = '#e8edf7'; ctx.beginPath(); ctx.moveTo(30 * s, 0); ctx.lineTo(-24 * s, -18 * s); ctx.lineTo(-16 * s, 0); ctx.lineTo(-24 * s, 18 * s); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4ea8ff'; ctx.beginPath(); ctx.ellipse(4 * s, 0, 9 * s, 5 * s, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
  for (const e of explosoes) {
    e.t += dt;
    ctx.globalAlpha = Math.max(0, 1 - e.t * 2); ctx.strokeStyle = e.cor; ctx.lineWidth = 4 * s;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.t * 140 * s, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
  }
  explosoes = explosoes.filter(e => e.t < 0.5);
  if (clarao > 0) { ctx.fillStyle = `rgba(255,255,255,${clarao * 0.6})`; ctx.fillRect(0, 0, W, H); clarao = Math.max(0, clarao - dt * 2); }

  texto(ctx, `${pontos}`, W / 2, 34 * s, 34 * s, '#fff');
  texto(ctx, '♥'.repeat(Math.max(0, vidas)), 24 * s, 34 * s, 30 * s, '#ff5470', 'left');
  if (estado === 'jogando') {
    texto(ctx, `tiros: ${municao}`, 24 * s, 66 * s, 20 * s, municao > 3 ? '#4ea8ff' : '#ffd166', 'left', 600);
    texto(ctx, `bombas: ${bombas}`, 24 * s, 92 * s, 20 * s, '#b04dff', 'left', 600);
    if (municao === 0 && Math.floor(performance.now() / 400) % 2) texto(ctx, 'SEM MUNIÇÃO: desvie e pegue uma caixa verde', W / 2, H - 20 * s, 22 * s, '#ffd166', 'center', 600);
  }
  texto(ctx, `recorde ${recorde('nave', 0)}`, W - 24 * s, 34 * s, 18 * s, '#93a1bd', 'right', 500);
  if (maoCm !== null) texto(ctx, `mão: ${maoCm} cm`, 24 * s, H - 16 * s, 18 * s, '#93a1bd', 'left', 500);
  if (estado === 'parado') {
    texto(ctx, 'NAVE', W / 2, H / 2 - 50 * s, 80 * s, '#fff');
    texto(ctx, 'Aperte o botão para começar', W / 2, H / 2 + 20 * s, 26 * s, '#ffd166', 'center', 500);
    texto(ctx, 'mão perto do sensor: desce · mão longe: sobe', W / 2, H / 2 + 60 * s, 20 * s, '#93a1bd', 'center', 500);
    texto(ctx, 'tiros acabam: pegue as caixas verdes · botão 2: bomba destrói tudo · naves vermelhas precisam de 2 tiros', W / 2, H / 2 + 92 * s, 18 * s, '#93a1bd', 'center', 500);
  }
  if (estado === 'fim') {
    texto(ctx, 'FIM DE JOGO', W / 2, H / 2 - 40 * s, 70 * s, '#ff5470');
    texto(ctx, `${pontos} pontos`, W / 2, H / 2 + 25 * s, 34 * s, '#fff');
    texto(ctx, 'Aperte o botão para jogar de novo', W / 2, H / 2 + 75 * s, 22 * s, '#ffd166', 'center', 500);
  }
}
requestAnimationFrame(quadro);
</script>
</body>
</html>
